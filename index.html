<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0866ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Messenger Pro">
<title>Messenger Pro</title>

<style>
:root{
  --blue:#0866ff;--blue2:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#050505;
  --muted:#65676b;--border:#dddfe2;--bubble:#e4e6eb;--input:#f0f2f5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{border:0;cursor:pointer}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:360px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
.top{padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:800;color:var(--blue)}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--input);display:grid;place-items:center;font-size:20px}
.row{display:flex;align-items:center;gap:12px}
.search{margin:0 16px 12px;background:var(--input);border-radius:22px;padding:10px 14px;display:flex;gap:9px;align-items:center}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}
.tabs{display:flex;padding:0 10px 8px;gap:5px}
.tab{flex:1;background:transparent;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.tab.active{background:#e7f3ff;color:var(--blue)}
.chats{overflow:auto;flex:1;padding:4px 8px}
.chat{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px}
.chat:hover,.chat.selected{background:#f2f3f5}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-weight:700;font-size:20px;flex:none;position:relative}
.online{position:absolute;right:1px;bottom:1px;width:14px;height:14px;background:#31a24c;border:3px solid white;border-radius:50%}
.chatmain{min-width:0;flex:1}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card)}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty .big{font-size:64px}
.header{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px}
.header .avatar{width:42px;height:42px;font-size:16px}
.back{display:none}
.headerinfo{flex:1}
.headername{font-weight:800}
.status{font-size:13px;color:#31a24c;margin-top:2px}
.actions{display:flex;gap:7px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:6px;background:#fff}
.day{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 12px}
.msgrow{display:flex}
.msgrow.me{justify-content:flex-end}
.bubble{max-width:min(72%,520px);padding:10px 13px;border-radius:18px;background:var(--bubble);font-size:15px;line-height:1.35;word-wrap:break-word}
.me .bubble{background:var(--blue);color:white;border-bottom-right-radius:5px}
.msgmeta{font-size:10px;color:var(--muted);margin:2px 7px}
.me .msgmeta{text-align:right}
.composer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.composeinput{flex:1;background:var(--input);border:0;outline:0;border-radius:22px;padding:12px 15px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#e7f3ff,#fff);display:grid;place-items:center;z-index:20;padding:20px}
.loginbox{width:min(410px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 15px 45px #0002}
.loginbox h1{color:var(--blue);margin:0 0 6px}
.loginbox p{color:var(--muted)}
.field{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;margin:7px 0;outline:0}
.primary{width:100%;padding:13px;border-radius:10px;background:var(--blue);color:white;font-weight:700;margin-top:8px}
.secondary{width:100%;padding:12px;border-radius:10px;background:#e7f3ff;color:var(--blue);font-weight:700;margin-top:8px}
.hide{display:none!important}
.profile{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end}
.profile.show{display:flex}
.sheet{background:white;width:100%;max-width:600px;margin:auto;border-radius:22px;padding:22px}
.sheet h2{margin-top:0}
@media(max-width:700px){
  .sidebar{width:100%;border-right:0}
  .main{display:none}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .main{display:flex}
  .back{display:grid}
  .header{height:64px}
}
@media(min-width:701px){.sidebar{display:flex!important}.back{display:none!important}}
.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:#3e4042;--bubble:#3a3b3c;--input:#3a3b3c}
.dark .messages{background:#18191a}.dark .login{background:#18191a}.dark .loginbox,.dark .sheet{background:#242526}
.dark .online{border-color:#242526}.dark .chat:hover,.dark .chat.selected{background:#303132}
</style>
</head>

<body>
<div id="login" class="login">
  <div class="loginbox">
    <h1>Messenger</h1>
    <p>Sign in to your Messenger account</p>
    <input id="email" class="field" type="email" placeholder="Email">
    <input id="password" class="field" type="password" placeholder="Password">
    <button class="primary" onclick="demoLogin()">Log In</button>
    <button class="secondary" onclick="createDemoAccount()">Create new account</button>
    <p id="loginMsg" style="font-size:13px"></p>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="top">
      <div class="logo">Messenger</div>
      <div class="row">
        <button class="iconbtn" onclick="openProfile()">👤</button>
        <button class="iconbtn" onclick="toggleDark()">🌙</button>
      </div>
    </div>
    <div class="search">🔎 <input id="search" placeholder="Search Messenger" oninput="filterChats()"></div>
    <div class="tabs">
      <button class="tab active">Chats</button>
      <button class="tab">People</button>
      <button class="tab">Groups</button>
    </div>
    <div id="chatList" class="chats"></div>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <div class="big">💬</div>
      <h2>Your messages</h2>
      <p>Select a chat to start messaging.</p>
    </div>

    <section id="chatPanel" class="hide" style="display:flex;flex-direction:column;height:100%">
      <header class="header">
        <button class="iconbtn back" onclick="closeChat()">‹</button>
        <div id="chatAvatar" class="avatar">B<span class="online"></span></div>
        <div class="headerinfo">
          <div id="chatName" class="headername">Baby</div>
          <div id="chatStatus" class="status">Active now</div>
        </div>
        <div class="actions">
          <button class="iconbtn">📞</button>
          <button class="iconbtn">🎥</button>
          <button class="iconbtn">ⓘ</button>
        </div>
      </header>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <button class="iconbtn">＋</button>
        <button class="iconbtn">🖼️</button>
        <input id="messageInput" class="composeinput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send" onclick="sendMessage()">➤</button>
      </div>
    </section>
  </main>
</div>

<div id="profile" class="profile" onclick="if(event.target===this)closeProfile()">
  <div class="sheet">
    <h2>Profile</h2>
    <p><b>Name:</b> My Messenger Account</p>
    <p><b>Status:</b> Online</p>
    <button class="primary" onclick="logout()">Log out</button>
    <button class="secondary" onclick="closeProfile()">Close</button>
  </div>
</div>

<script>
const chats=[
 {id:1,name:"Baby",initial:"B",status:"Active now",preview:"Hello! How are you?",time:"2:56 PM",online:true},
 {id:2,name:"Messenger Team",initial:"M",status:"Active 10m ago",preview:"Welcome to Messenger",time:"1:42 PM",online:false},
 {id:3,name:"Family Group",initial:"F",status:"5 members",preview:"See you tonight",time:"12:20 PM",online:false}
];
let current=null;
const messages={
  1:[
   {me:false,text:"Hello! 👋",time:"2:54 PM"},
   {me:true,text:"Hi! How are you?",time:"2:55 PM"},
   {me:false,text:"I'm good. Nice to see you here!",time:"2:56 PM"}
  ],
  2:[{me:false,text:"Welcome to Messenger Pro.",time:"1:42 PM"}],
  3:[{me:false,text:"See you tonight everyone!",time:"12:20 PM"}]
};

function renderChats(list=chats){
 const box=document.getElementById('chatList');
 box.innerHTML=list.map(c=>`
 <div class="chat ${current===c.id?'selected':''}" onclick="openChat(${c.id})">
   <div class="avatar">${c.initial}${c.online?'<span class="online"></span>':''}</div>
   <div class="chatmain"><div class="name">${c.name}</div><div class="preview">${c.preview}</div></div>
   <div class="time">${c.time}</div>
 </div>`).join('');
}
function openChat(id){
 current=id;const c=chats.find(x=>x.id===id);
 document.getElementById('empty').classList.add('hide');
 document.getElementById('chatPanel').classList.remove('hide');
 document.getElementById('chatName').textContent=c.name;
 document.getElementById('chatStatus').textContent=c.status;
 document.getElementById('chatAvatar').innerHTML=c.initial+(c.online?'<span class="online"></span>':'');
 renderMessages();renderChats();document.getElementById('app').classList.add('chat-open');
}
function closeChat(){document.getElementById('app').classList.remove('chat-open')}
function renderMessages(){
 const box=document.getElementById('messages');
 box.innerHTML='<div class="day">Today</div>'+ (messages[current]||[]).map(m=>`
 <div class="msgrow ${m.me?'me':''}"><div><div class="bubble">${escapeHtml(m.text)}</div><div class="msgmeta">${m.time}${m.me?' · Seen':''}</div></div></div>`).join('');
 box.scrollTop=box.scrollHeight;
}
function sendMessage(){
 const input=document.getElementById('messageInput');const text=input.value.trim();
 if(!text||!current)return;
 const now=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 (messages[current]??=[]).push({me:true,text,time:now});
 const c=chats.find(x=>x.id===current);c.preview=text;c.time=now;
 input.value='';renderMessages();renderChats();
}
function filterChats(){
 const q=document.getElementById('search').value.toLowerCase();
 renderChats(chats.filter(c=>c.name.toLowerCase().includes(q)));
}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))}
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');
function openProfile(){document.getElementById('profile').classList.add('show')}
function closeProfile(){document.getElementById('profile').classList.remove('show')}
function logout(){document.getElementById('profile').classList.remove('show');document.getElementById('login').classList.remove('hide')}
function demoLogin(){
 const email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;
 if(!email||!pass){document.getElementById('loginMsg').textContent='Enter email and password.';return}
 document.getElementById('login').classList.add('hide');
}
function createDemoAccount(){
 document.getElementById('loginMsg').textContent='Demo account screen ready. Connect Firebase Authentication for real accounts.';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderChats();
</script>
</body>
</html>
