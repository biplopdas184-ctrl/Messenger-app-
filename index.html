<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0084ff">
<title>Messenger</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}
body{background:#fff;color:#111;overflow:hidden}button,input,textarea{font:inherit}
button{border:0;cursor:pointer}.hidden{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px}.authbox{width:min(400px,100%);text-align:center}
.logo{width:72px;height:72px;border-radius:50%;background:#0084ff;color:#fff;display:grid;place-items:center;font-size:40px;font-weight:700;margin:auto auto 16px}
.authbox h1{color:#0084ff;margin:0 0 8px}.authbox p{color:#666}.field{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:6px 0;outline:none;background:#f5f6f7}
.primary{width:100%;padding:14px;background:#0084ff;color:#fff;border-radius:12px;font-weight:700;margin-top:8px}
.link{display:block;color:#0084ff;margin:15px 0;cursor:pointer}
#app{height:100%;display:flex}.side{width:350px;border-right:1px solid #ddd;display:flex;flex-direction:column;background:#fff}
.sidehead{padding:14px;display:flex;justify-content:space-between;align-items:center}.sidehead h2{margin:0;font-size:26px}
.icon{width:40px;height:40px;border-radius:50%;background:#eee;margin-left:4px}.search{padding:0 14px 10px}.search input{width:100%;border:0;background:#f0f2f5;border-radius:22px;padding:12px 15px;outline:0}
.me{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #eee}.avatar{width:48px;height:48px;border-radius:50%;background:#0084ff;color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.meinfo{flex:1}.chatlist{overflow:auto;flex:1}.chatitem{display:flex;gap:10px;padding:11px 14px;align-items:center}.chatitem:hover,.chatitem.active{background:#f0f2f5}.chatinfo{min-width:0;flex:1}.chatinfo b,.chatinfo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatinfo span{font-size:13px;color:#666}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{height:70px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:10px 14px}.chatwho{flex:1}.online{font-size:12px;color:#31a24c}.messages{flex:1;overflow:auto;padding:18px;background:#fff}.msg{display:flex;margin:7px 0}.msg.mine{justify-content:flex-end}.bubble{max-width:min(78%,460px);background:#e4e6eb;border-radius:18px;padding:9px 13px;overflow-wrap:anywhere}.mine .bubble{background:#0084ff;color:#fff}.meta{font-size:10px;opacity:.65;margin-top:3px}.composer{display:flex;gap:7px;align-items:center;padding:9px;border-top:1px solid #ddd}.composer input{flex:1;border:0;background:#f0f2f5;border-radius:22px;padding:12px 15px;outline:0}.send{width:44px;height:44px;border-radius:50%;background:#0084ff;color:#fff}.file{display:none}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(420px,100%);background:#fff;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}.modalbox h3{margin-top:0}
#privacy{position:fixed;inset:0;background:#fff;z-index:30;display:none;place-items:center;padding:20px;text-align:center}.privacybox{width:min(360px,100%)}
.dark{background:#18191a;color:#eee}.dark #app,.dark .side,.dark .main,.dark .messages,.dark #auth,.dark .modalbox,.dark #privacy{background:#18191a;color:#eee}.dark .search input,.dark .composer input,.dark .icon{background:#3a3b3c;color:#fff}.dark .chatitem:hover,.dark .chatitem.active{background:#303030}.dark .bubble{background:#3a3b3c}.dark .chathead,.dark .composer,.dark .side,.dark .me{border-color:#3a3b3c}
@media(max-width:700px){.side{width:100%}.main{display:none}.openchat .side{display:none}.openchat .main{display:flex}.mobileback{display:block!important}}
@media(min-width:701px){.mobileback{display:none}}
</style>
</head>
<body>
<div id="auth">
<div class="authbox">
<div class="logo">M</div><h1>Messenger</h1><p>Firebase Messenger</p>
<div id="loginBox">
<input id="email" class="field" type="email" placeholder="Email">
<input id="password" class="field" type="password" placeholder="Password">
<button id="login" class="primary">Log in</button>
<span id="forgot" class="link">Forgot password?</span><span id="toSignup" class="link">Create new account</span>
</div>
<div id="signupBox" class="hidden">
<input id="name" class="field" placeholder="Name">
<input id="sEmail" class="field" type="email" placeholder="Email">
<input id="sPassword" class="field" type="password" placeholder="Password (6+ characters)">
<button id="signup" class="primary">Sign up</button><span id="toLogin" class="link">Already have an account?</span>
</div>
</div></div>

<div id="app" class="hidden">
<aside class="side">
<div class="sidehead"><h2>Chats</h2><div><button class="icon" id="profileBtn">👤</button><button class="icon" id="privacyBtn">🔒</button><button class="icon" id="darkBtn">🌙</button></div></div>
<div class="search"><input id="search" placeholder="Search users"></div>
<div class="me"><div class="avatar" id="myAvatar">U</div><div class="meinfo"><b id="myName">User</b><small>Active</small></div><button class="icon" id="logout">↪</button></div>
<div id="chatlist" class="chatlist"></div>
</aside>
<main class="main">
<div class="chathead"><button id="back" class="icon mobileback">←</button><div class="avatar" id="chatAvatar">?</div><div class="chatwho"><b id="chatName">Select a user</b><div id="chatPresence" class="online"></div><small id="typing"></small></div><button class="icon" title="Voice">📞</button><button class="icon" title="Video">🎥</button></div>
<div id="messages" class="messages"><div style="text-align:center;color:#777;margin-top:30vh">Search a user to start a chat.</div></div>
<div class="composer"><label class="icon">📷<input id="image" class="file" type="file" accept="image/*"></label><label class="icon">📎<input id="file" class="file" type="file"></label><button class="icon" id="voice">🎤</button><input id="text" placeholder="Type a message..." disabled><button id="send" class="send" disabled>➤</button></div>
</main></div>

<div id="modal" class="modal hidden"><div class="modalbox"><h3 id="modalTitle">Profile</h3><div id="modalBody"></div><button id="closeModal" class="primary">Close</button></div></div>
<div id="privacy" class="privacybox"><div class="logo">🔒</div><h2>Privacy Mode</h2><p>App locked</p><input id="unlockPin" class="field" inputmode="numeric" maxlength="6" placeholder="PIN"><button id="unlock" class="primary">Unlock</button></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDoc,query,where,orderBy,onSnapshot,addDoc,serverTimestamp,limit,updateDoc}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyBLw3kGNaKB9JCzN_mW8sS1Yv7cpp6SvhU",authDomain:"messenger-app-2e8b1.firebaseapp.com",projectId:"messenger-app-2e8b1",storageBucket:"messenger-app-2e8b1.firebasestorage.app",messagingSenderId:"913049885136",appId:"1:913049885136:web:cc07e7ee59faaee91b41d5",measurementId:"G-ED5NDMYXRS"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=x=>document.getElementById(x);let me=null,active=null,unsubUsers=null,unsubMsgs=null,unsubPresence=null,unsubTyping=null;
const esc=s=>{let d=document.createElement("div");d.textContent=s??"";return d.innerHTML};const cid=(a,b)=>[a,b].sort().join("_");

$("toSignup").onclick=()=>{$("loginBox").classList.add("hidden");$("signupBox").classList.remove("hidden")};
$("toLogin").onclick=()=>{$("signupBox").classList.add("hidden");$("loginBox").classList.remove("hidden")};
$("signup").onclick=async()=>{try{let n=$("name").value.trim(),e=$("sEmail").value.trim(),p=$("sPassword").value;if(!n||!e||p.length<6)return alert("Fill all fields. Password must be 6+ characters.");let c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:n,email:e,online:true,createdAt:serverTimestamp()},{merge:true})}catch(e){alert(e.message)}};
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){alert(e.message)}};
$("forgot").onclick=async()=>{let e=$("email").value.trim();if(!e)return alert("Enter email first.");try{await sendPasswordResetEmail(auth,e);alert("Password reset email sent.")}catch(x){alert(x.message)}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{if(!u){me=null;$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}me=u;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("myName").textContent=u.displayName||u.email;$("myAvatar").textContent=(u.displayName||u.email)[0].toUpperCase();await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:u.displayName||"User",email:u.email,online:true,lastSeen:serverTimestamp()},{merge:true});listenUsers();});
window.addEventListener("beforeunload",()=>{if(me)setDoc(doc(db,"users",me.uid),{online:false,lastSeen:serverTimestamp()},{merge:true})});

function listenUsers(){if(unsubUsers)unsubUsers();unsubUsers=onSnapshot(query(collection(db,"users"),limit(100)),s=>{let t=$("search").value.toLowerCase();$("chatlist").innerHTML="";s.forEach(d=>{let u=d.data();if(u.uid===me.uid)return;if(t&&!((u.name||"")+" "+(u.email||"")).toLowerCase().includes(t))return;let x=document.createElement("div");x.className="chatitem";x.innerHTML=`<div class="avatar">${esc((u.name||u.email||"?")[0].toUpperCase())}</div><div class="chatinfo"><b>${esc(u.name||"User")}</b><span>${esc(u.email||"")}</span></div>`;x.onclick=()=>openChat(u);$("chatlist").appendChild(x)})})}
$("search").oninput=listenUsers;

async function openChat(u){active=u;document.body.classList.add("openchat");$("chatName").textContent=u.name||u.email;$("chatAvatar").textContent=(u.name||u.email)[0].toUpperCase();$("text").disabled=false;$("send").disabled=false;if(unsubMsgs)unsubMsgs();if(unsubPresence)unsubPresence();if(unsubTyping)unsubTyping();
unsubPresence=onSnapshot(doc(db,"users",u.uid),d=>{let x=d.data()||{};$("chatPresence").textContent=x.online?"● Online":(x.lastSeen?"Last seen recently":"Offline")});
let q=query(collection(db,"chats",cid(me.uid,u.uid),"messages"),orderBy("createdAt","asc"),limit(300));unsubMsgs=onSnapshot(q,s=>{$("messages").innerHTML="";s.forEach(d=>render(d.id,d.data()));$("messages").scrollTop=$("messages").scrollHeight})}
function render(id,m){let r=document.createElement("div");r.className="msg"+(m.senderId===me.uid?" mine":"");let b=document.createElement("div");b.className="bubble";if(m.type==="image"){let im=document.createElement("img");im.src=m.url;im.style.maxWidth="240px";im.style.borderRadius="14px";b.appendChild(im)}else if(m.type==="file"){let a=document.createElement("a");a.href=m.url;a.target="_blank";a.textContent="📎 "+(m.name||"File");a.style.color="inherit";b.appendChild(a)}else if(m.type==="voice"){b.textContent="🎤 Voice message"}else b.textContent=m.text||"";let meta=document.createElement("div");meta.className="meta";meta.textContent=m.senderId===me.uid?(m.seen?"✓✓ Seen":m.delivered?"✓✓ Delivered":"✓ Sent"):"";b.appendChild(meta);if(m.senderId===me.uid){b.ondblclick=async()=>{if(confirm("Delete this message?"))await setDoc(doc(db,"chats",cid(me.uid,active.uid),"messages",id),{...m,deleted:true,text:"Message deleted"})}}r.appendChild(b);$("messages").appendChild(r)}

async function send(text,type="text",extra={}){if(!active||(!text&&!extra.url))return;await addDoc(collection(db,"chats",cid(me.uid,active.uid),"messages"),{senderId:me.uid,receiverId:active.uid,text:text||"",type,delivered:false,seen:false,createdAt:serverTimestamp(),...extra})}
$("send").onclick=()=>{let t=$("text").value.trim();if(t){$("text").value="";send(t)}};
$("text").onkeydown=e=>{if(e.key==="Enter")$("send").click()};
$("image").onchange=async e=>{let f=e.target.files[0];if(!f||!active)return;try{let r=ref(storage,`chatImages/${me.uid}/${Date.now()}_${f.name}`);await uploadBytes(r,f);send("", "image",{url:await getDownloadURL(r),name:f.name})}catch(x){alert(x.message)}e.target.value=""};
$("file").onchange=async e=>{let f=e.target.files[0];if(!f||!active)return;try{let r=ref(storage,`chatFiles/${me.uid}/${Date.now()}_${f.name}`);await uploadBytes(r,f);send("", "file",{url:await getDownloadURL(r),name:f.name})}catch(x){alert(x.message)}e.target.value=""};

let rec=null,voiceChunks=[];$("voice").onclick=async()=>{if(!active)return;if(!rec){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);voiceChunks=[];rec.ondataavailable=e=>voiceChunks.push(e.data);rec.onstop=async()=>{let blob=new Blob(voiceChunks,{type:"audio/webm"}),r=ref(storage,`voice/${me.uid}/${Date.now()}.webm`);await uploadBytes(r,blob);send("", "voice",{url:await getDownloadURL(r)})};rec.start();$("voice").textContent="⏹️"}catch(e){alert("Microphone permission is required.")}}else{rec.stop();rec.stream.getTracks().forEach(t=>t.stop());rec=null;$("voice").textContent="🎤"}};

$("back").onclick=()=>document.body.classList.remove("openchat");$("darkBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.dark=document.body.classList.contains("dark")?"1":"0"};if(localStorage.dark==="1")document.body.classList.add("dark");

$("profileBtn").onclick=()=>{$("modal").classList.remove("hidden");$("modalTitle").textContent="Profile";$("modalBody").innerHTML=`<p><b>${esc(me.displayName||"User")}</b></p><p>${esc(me.email)}</p><input id="newName" class="field" placeholder="New name"><input id="newPhoto" class="field" type="file" accept="image/*"><button id="saveProfile" class="primary">Save profile</button>`;$("saveProfile").onclick=async()=>{let n=$("newName").value.trim();if(n){await updateProfile(me,{displayName:n});await setDoc(doc(db,"users",me.uid),{name:n},{merge:true})}let f=$("newPhoto").files[0];if(f){let r=ref(storage,`profiles/${me.uid}/${Date.now()}_${f.name}`);await uploadBytes(r,f);let url=await getDownloadURL(r);await setDoc(doc(db,"users",me.uid),{photoURL:url},{merge:true})}alert("Profile saved.");$("modal").classList.add("hidden");location.reload()}};
$("closeModal").onclick=()=>$("modal").classList.add("hidden");

$("privacyBtn").onclick=()=>{if(!localStorage.pin){let p=prompt("Create 4-6 digit Privacy PIN");if(p&&/^\d{4,6}$/.test(p)){localStorage.pin=p;alert("Privacy PIN saved.")}}else $("privacy").style.display="grid"};
$("unlock").onclick=()=>{if($("unlockPin").value===localStorage.pin){$("privacy").style.display="none";$("unlockPin").value=""}else alert("Wrong PIN.")};
</script>
</body></html>
